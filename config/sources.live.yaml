# LIVE sources: the real bank pages. Layouts are null on purpose: on the first run the Collector agent calibrates each page,
# a human approves the saved layout, and later runs use the approved layout without calling the LLM.
# kind: html (plain page) | browser (Playwright: JS pages, tabs) | pdf.   actions: Playwright steps before reading, e.g. [{click: 'text=Non-callable'}]
# Check first on your laptop:  python -m src.main check <source_id>
sources:
- {id: sber_corporate, bank: Sberbank, product: corporate, status: current, effective: '', kind: browser,
   url: 'https://sber.bank.in/tariffs-and-conditions', expect: {min_rows: 40}, layout: null}
- {id: hdfc_withdrawable, bank: HDFC, product: withdrawable, status: proxy, effective: '', kind: browser,
   url: 'https://www.hdfc.bank.in/interest-rates', expect: {min_rows: 40}, layout: null}
- {id: icici_callable, bank: ICICI, product: callable, status: default_table, effective: '', kind: browser,
   url: 'https://www.icici.bank.in/business-banking/fixed-deposit/fd-interest-rates', expect: {min_rows: 8}, layout: null}
- {id: sbi_bulk, bank: SBI, product: bulk, status: current, effective: '', kind: browser,
   url: 'https://sbi.co.in/web/interest-rates/deposit-rates/domestic-bulk-term-deposits', expect: {min_rows: 8}, layout: null}
- {id: rbl_callable, bank: RBL, product: callable, status: current, effective: '', kind: pdf,
   url: 'https://webassets.rbl.bank.in/document/pdfs/callable-bulk-fd-rates.pdf', expect: {min_rows: 100}, layout: null}
- {id: rbl_noncallable, bank: RBL, product: noncallable, status: current, effective: '', kind: pdf,
   url: 'https://webassets.rbl.bank.in/document/pdfs/non-callable-bulk-fd-rates.pdf', expect: {min_rows: 100}, layout: null}
