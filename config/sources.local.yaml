# LOCAL sources: local copies of the bank pages (served by the built-in fixture server). Same agent code as live mode.
# status: current | proxy (not corporate-only) | default_table (amount tabs not read) | stale (old sheet)
# layout: where the numbers are. null = the Collector agent calibrates it and a human approves the result.
